<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling — QR Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/qr.css">
</head>
<body>

<div class="wrap">
  <div class="panel glass">
    <a class="back-link" href="builder.html">← Back to builder</a>
    <h1>Review cards</h1>
    <p class="sub">A shareable card per location — ready for print, WhatsApp status, or social posts. The logo sits above the code, so the QR itself stays clean and easy to scan.</p>

    <div class="field">
      <label for="qLocation">Location</label>
      <select class="input" id="qLocation"></select>
    </div>

    <div class="field">
      <label for="qCaption">Caption</label>
      <input type="text" class="input" id="qCaption" value="Scan to leave us a Google review">
    </div>

    <div class="field">
      <label for="qFooter">Footer text</label>
      <input type="text" class="input" id="qFooter" value="We'd love your feedback — it takes 30 seconds">
      <div class="hint">Small line under the caption. Optional.</div>
    </div>

    <div class="field">
      <label>Encoded URL</label>
      <div class="url-box mono" id="qUrl"></div>
    </div>

    <div class="dl-row">
      <button class="btn btn-primary" id="dlPng">Download PNG · 1080×1350</button>
      <button class="btn btn-glass" id="dlSvg">QR only · SVG</button>
    </div>
  </div>

  <div class="preview-area">
    <div class="preview-label">Live preview — share / print</div>
    <div class="qr-card" id="qrCard">
      <div class="card-logo" id="cardLogo"></div>
      <div class="card-name" id="cardName"></div>
      <div class="card-qr" id="qrHolder"></div>
      <div class="card-caption" id="qrCaptionText"></div>
      <div class="card-footer" id="qrFooterText"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script
